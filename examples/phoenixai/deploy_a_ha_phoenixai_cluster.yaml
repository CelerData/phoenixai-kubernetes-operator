# This manifest deploys a high-available PhoenixAI cluster with 3 FE pods and 3 CN pods.
# A high-available PhoenixAI cluster requires at least THREE FE pods in the PhoenixAI cluster. One of them is the
# leader, and the other two are the followers.
# PhoenixAI cluster.
# The requests and limits of FE and CN are set based on https://docs.starrocks.io/docs/deployment/plan_cluster/

apiVersion: phoenixdata.ai/v1
kind: PhoenixAICluster
metadata:
  name: a-ha-phoenixai   # change the name if needed.
spec:
  phoenixAIFeSpec:
    image: us-west1-docker.pkg.dev/phoenix-ai-images/enterprise/fe-ubuntu:4.1.7-ee
    replicas: 3   # at least 3 FE pods
    # reference the ConfigMap at the bottom of this file, which holds fe.conf.
    configMapInfo:
      configMapName: a-ha-phoenixai-fe-cm
      resolveKey: fe.conf
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 8
      memory: 16Gi
  phoenixAICnSpec:
    image: us-west1-docker.pkg.dev/phoenix-ai-images/enterprise/cn-ubuntu:4.1.7-ee
    replicas: 3 # at least 3 CN pods
    limits:
      cpu: 16
      memory: 64Gi
    requests:
      cpu: 16
      memory: 64Gi

---

# FE config. The operator deploys shared-data (elastic) clusters only and refuses a cluster whose
# fe.conf does not set run_mode = shared_data; the mode is fixed when the FE first starts. These
# lines let the FE start before any object storage is configured: create a storage volume with SQL
# afterwards, or add the aws_s3_* settings here (see deploy_a_phoenixai_cluster_running_in_shared_data_mode.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: a-ha-phoenixai-fe-cm
data:
  fe.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    run_mode = shared_data
    cloud_native_storage_type = S3
    cloud_native_meta_port = 6090
    enable_load_volume_from_conf = false
