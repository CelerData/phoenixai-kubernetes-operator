# This manifest deploys a PhoenixAI cluster with FE, CN, FE Proxy
# To load data from outside the Kubernetes cluster into StarRocks deployed within the Kubernetes
# cluster, you can deploy the FE Proxy component. So that External data import tools, like flink,
# can use the STREAM LOAD syntax to import data into PhoenixAI clusters.
# see https://docs.starrocks.io/docs/loading/Flink-connector-starrocks/ for more information
# about how to use flink to import data into StarRocks.

apiVersion: phoenixdata.ai/v1
kind: PhoenixAICluster
metadata:
  name: a-phoenixai-with-fe-proxy   # change the name if needed.
spec:
  phoenixAIFeSpec:
    image: us-west1-docker.pkg.dev/phoenix-ai-images/enterprise/fe-ubuntu:4.1.7-ee
    replicas: 3
    # reference the ConfigMap at the bottom of this file, which holds fe.conf.
    configMapInfo:
      configMapName: a-phoenixai-with-fe-proxy-fe-cm
      resolveKey: fe.conf
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 8
      memory: 16Gi
    service:
      type: NodePort   # export fe service
      ports:
      - name: query   # fill the name from the fe service ports
        nodePort: 32755
        port: 9030
        containerPort: 9030
  phoenixAICnSpec:
    image: us-west1-docker.pkg.dev/phoenix-ai-images/enterprise/cn-ubuntu:4.1.7-ee
    replicas: 3
    limits:
      cpu: 16
      memory: 64Gi
    requests:
      cpu: 16
      memory: 64Gi
  phoenixAIFeProxySpec:
    replicas: 1
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 1
      memory: 2Gi
    service:
      type: NodePort   # export fe proxy service
      ports:
        - name: http-port   # fill the name from the fe proxy service ports
          containerPort: 8080
          nodePort: 30180   # The range of valid ports is 30000-32767
          port: 8080
    resolver: "kube-dns.kube-system.svc.cluster.local"  # this is the default dns server.

---

# FE config. The operator deploys shared-data (elastic) clusters only and refuses a cluster whose
# fe.conf does not set run_mode = shared_data; the mode is fixed when the FE first starts. These
# lines let the FE start before any object storage is configured: create a storage volume with SQL
# afterwards, or add the aws_s3_* settings here (see deploy_a_phoenixai_cluster_running_in_shared_data_mode.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: a-phoenixai-with-fe-proxy-fe-cm
data:
  fe.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    run_mode = shared_data
    cloud_native_storage_type = S3
    cloud_native_meta_port = 6090
    enable_load_volume_from_conf = false
