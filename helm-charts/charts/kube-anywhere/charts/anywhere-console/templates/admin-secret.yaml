{{- /*
Admin Console accounts: one Secret,
key = username, value = password, mounted as a directory and read by the
backend on every login (rotation needs no restart). Three account sources,
in order of precedence:
  1. admin.existingSecret — user-managed Secret, nothing rendered;
  2. admin.users          — rendered verbatim (deterministic output:
                            required for pure-render pipelines like
                            ArgoCD / helm template). values.yaml ships
                            admin/admin here, so this is the branch a
                            default install takes;
  3. neither              — a single "admin" account with a random
                            password, generated once: `lookup` keeps the
                            existing Secret content across helm upgrades,
                            including accounts added by hand. Reached only
                            when admin.users is cleared. NOTE: lookup sees
                            nothing under `helm template`/ArgoCD, which
                            would re-randomize the password on every sync —
                            GitOps installs must set users or existingSecret
                            instead.
The shipped admin/admin default is a public password, so any install
someone else can reach must replace it — set admin.users /
admin.existingSecret, or edit this Secret.
*/}}
{{- $admin := .Values.admin }}
{{- if not $admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "anywhere.adminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
type: Opaque
{{- if $admin.users }}
stringData:
  {{- range $user, $password := $admin.users }}
  {{ $user }}: {{ $password | quote }}
  {{- end }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "anywhere.adminSecretName" .) }}
{{- if $existing }}
data:
  {{- range $user, $password := $existing.data }}
  {{ $user }}: {{ $password }}
  {{- end }}
{{- else }}
stringData:
  admin: {{ randAlphaNum 16 | quote }}
{{- end }}
{{- end }}
{{- end }}
