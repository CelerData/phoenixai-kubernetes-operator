{{- if include "anywhere.watchNamespaces" . | fromJsonArray | not }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "anywhere.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "anywhere.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ template "anywhere.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
