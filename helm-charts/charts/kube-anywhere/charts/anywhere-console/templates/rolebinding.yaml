{{- range $ns := (include "anywhere.watchNamespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "anywhere.name" $ }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "anywhere.name" $ }}
subjects:
- kind: ServiceAccount
  name: {{ template "anywhere.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
