{{- /*
The main config file: the binary takes a single --config flag and every runtime setting lives
in this YAML — there are no PHOENIXAI_ANYWHERE_* environment variables. Rendered as a Secret
(not a ConfigMap) because the inlined dependencies block carries credentials (S3 keys,
Prometheus auth). The statefulset stamps a checksum of this Secret onto the pod template, so
`helm upgrade` changing any value here rolls the pod — the config is read once at startup. Admin
accounts stay a separate Secret directory (per-login re-read, restartless rotation).
*/}}
{{- /* Nil-safe lookup: `helm upgrade --reuse-values` from an older chart carries the old
     computed values, in which newly added keys (or the whole block) may be absent — hit for
     real on the 0.2.0 -> 0.3.0 upgrade (2026-08-06). */}}
{{- $sb := .Values.supportBundle | default dict }}
{{- $qh := .Values.queryHistory | default dict }}
{{- $lic := .Values.license | default dict }}
{{- $auth := .Values.auth | default dict }}
{{- /* Refuse a stale layout at render time (chart convention, as statefulset.yaml does):
     supportBundle.maxBytes is retired. The template never referenced it, so a leftover value
     was silently dropped and the operator believed a whole-bundle cap still applied. Fail loudly
     instead — volume is now bounded per request (window / pod subsets / log-file types), on top
     of a fixed server-side per-pod ceiling. */}}
{{- if hasKey $sb "maxBytes" }}
{{- fail "supportBundle.maxBytes is retired (the whole-bundle byte cap no longer exists; volume is bounded per request). Remove supportBundle.maxBytes from your values." }}
{{- end }}
{{- $insp := .Values.inspection | default dict }}
{{- $deps := .Values.dependencies | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "anywhere.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
type: Opaque
stringData:
  config.yaml: |
    listenAddr: ":{{ .Values.httpPort }}"
    logLevel: {{ .Values.logLevel | quote }}
    # One entry per operator this anywhere serves; order arbitrates ownership conflicts.
    operatorApiAddrs:
    {{- range .Values.operatorApiAddrs }}
      - {{ . | quote }}
    {{- end }}
    # Embedded relational storage (SQLite) lives on the data PVC
    # (templates/pvc.yaml).
    dataDir: /var/lib/phoenixai-anywhere
    {{- if or $insp.enabledRules $insp.disabledRules }}
    # CR-inspection rule selection (see .Values.inspection); changes roll the
    # pod via the config checksum annotation.
    inspection:
{{ toYaml (dict "enabledRules" $insp.enabledRules "disabledRules" $insp.disabledRules) | indent 6 }}
    {{- end }}
    {{- /* Exactly one object-store block (s3 / azblob / adls2) is configured — enforced at render
         time in statefulset.yaml — and only that one is rendered: the backend treats a block's
         presence as "configured". The rendered comment below is part of the Secret's bytes and
         therefore of the config checksum, so it stays word for word what it was before the Azure
         blocks existed: an s3-only install must render the same Secret as before, or every
         upgrade would roll the pod for nothing (render-test pins this with a snapshot). The Azure
         lookups are nil-safe for the same --reuse-values reason as the blocks above. */}}
    # User-injected external dependencies (see .Values.dependencies): object
    # storage is required, Prometheus is optional. Read once at startup;
    # changes roll the pod via the checksum annotation.
    {{- $s3 := $deps.s3 | default dict }}
    {{- $azblob := $deps.azblob | default dict }}
    {{- $adls2 := $deps.adls2 | default dict }}
    {{- $gs := $deps.gs | default dict }}
    {{- $prom := $deps.prometheus | default dict }}
    {{- $promTLS := $prom.tls | default dict }}
    dependencies:
      {{- if $s3.bucket }}
      s3:
        bucket: {{ $s3.bucket | quote }}
        path: {{ $s3.path | quote }}
        region: {{ $s3.region | quote }}
        endpoint: {{ $s3.endpoint | quote }}
        accessKey: {{ $s3.accessKey | quote }}
        secretKey: {{ $s3.secretKey | quote }}
        {{- if eq (include "anywhere.bool" $s3.usePathStyle) "true" }}
        usePathStyle: true
        {{- end }}
      {{- end }}
      {{- range $name, $az := dict "azblob" $azblob "adls2" $adls2 }}
      {{- if $az.container }}
      {{ $name }}:
        endpoint: {{ $az.endpoint | quote }}
        container: {{ $az.container | quote }}
        path: {{ $az.path | quote }}
        {{- if $az.sharedKey }}
        sharedKey: {{ $az.sharedKey | quote }}
        {{- end }}
        {{- if $az.sasToken }}
        sasToken: {{ $az.sasToken | quote }}
        {{- end }}
        {{- /* The Entra ID keys render only when set, like the two above: an install that sets
             none of them renders the same Secret as before they existed. */}}
        {{- /* Compared as a string, never by truthiness: --set-string or a quoted YAML value hands
             over "false", which `if` reads as true and which would then sit beside a sharedKey
             and refuse startup. Anything but true / false is refused here rather than dropped. */}}
        {{- $mi := toString (ternary "" $az.oauth2UseManagedIdentity (kindIs "invalid" $az.oauth2UseManagedIdentity)) }}
        {{- if not (has $mi (list "" "true" "false")) }}
        {{- /* The key name is an argument: spelled out right after "%s." it has the shape of a
             Vault service token, and secret scanners report the line. */}}
        {{- fail (printf "dependencies.%s.%s must be true or false, got %q" $name "oauth2UseManagedIdentity" $mi) }}
        {{- end }}
        {{- if eq $mi "true" }}
        oauth2UseManagedIdentity: true
        {{- end }}
        {{- range $key := list "oauth2TokenFile" "oauth2TenantId" "oauth2ClientId" "oauth2ClientSecret" "oauth2ClientEndpoint" }}
        {{- with index $az $key }}
        {{ $key }}: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- if $gs.bucket }}
      gs:
        bucket: {{ $gs.bucket | quote }}
        path: {{ $gs.path | quote }}
        endpoint: {{ $gs.endpoint | quote }}
        {{- if eq (include "anywhere.bool" $gs.useComputeEngineServiceAccount) "true" }}
        useComputeEngineServiceAccount: true
        {{- end }}
        {{- if $gs.serviceAccountEmail }}
        serviceAccountEmail: {{ $gs.serviceAccountEmail | quote }}
        {{- end }}
        {{- if $gs.serviceAccountPrivateKeyId }}
        serviceAccountPrivateKeyId: {{ $gs.serviceAccountPrivateKeyId | quote }}
        {{- end }}
        {{- if $gs.serviceAccountPrivateKey }}
        serviceAccountPrivateKey: {{ $gs.serviceAccountPrivateKey | quote }}
        {{- end }}
        {{- if $gs.impersonationServiceAccount }}
        impersonationServiceAccount: {{ $gs.impersonationServiceAccount | quote }}
        {{- end }}
      {{- end }}
      {{- /* Every boolean switch below is read through anywhere.bool, never by bare truthiness:
           a string "false" (--set-string, a quoted values file) must stay off. Every other value
           reads as it always did, so only an install that passed "false" renders differently. */}}
      {{- if eq (include "anywhere.bool" $prom.enabled) "true" }}
      prometheus:
        endpoint: {{ $prom.endpoint | quote }}
        username: {{ $prom.username | quote }}
        password: {{ $prom.password | quote }}
        {{- if $prom.bearerToken }}
        bearerToken: {{ $prom.bearerToken | quote }}
        {{- end }}
        {{- with $prom.headers }}
        headers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $insecure := include "anywhere.bool" $promTLS.insecureSkipVerify }}
        {{- if or $promTLS.caCert (eq $insecure "true") }}
        tls:
          {{- if $promTLS.caCert }}
          caCert: {{ $promTLS.caCert | quote }}
          {{- end }}
          insecureSkipVerify: {{ $insecure }}
        {{- end }}
        {{- if $prom.metricPrefix }}
        metricPrefix: {{ $prom.metricPrefix | quote }}
        {{- end }}
        {{- if $prom.clusterLabel }}
        clusterLabel: {{ $prom.clusterLabel | quote }}
        {{- end }}
      {{- end }}
    auth:
      # Admin Console accounts: the mounted Secret dir (one file per
      # username), read on every login so rotation needs no restart.
      adminCredentialsDir: /etc/phoenixai-anywhere/admin-credentials
      {{- /* Both render only when set, so an install that configures neither
           produces the same file it did before these keys existed — no
           checksum change, no pod roll on upgrade. The service's own defaults
           (cookies not Secure, a 24h sliding TTL) are what an absent key
           means, which is why neither carries a `default` filter here. */}}
      {{- if eq (include "anywhere.bool" $auth.secureCookies) "true" }}
      secureCookies: true
      {{- end }}
      {{- if $auth.sessionTTL }}
      sessionTTL: {{ $auth.sessionTTL | quote }}
      {{- end }}
    # Support bundles stream into the object store — no staging directory, no
    # emptyDir. Retention is time-only; the former whole-bundle byte cap
    # (maxBytes) is retired — volume is bounded per request (window / pod
    # subsets / log-file types), on top of a fixed server-side per-pod ceiling.
    # That bounds the TOTAL; streamRateLimitMBps below bounds the PEAK (bytes
    # per second crossing the kube-apiserver proxy) and is unaffected by any of
    # the above. It has no `default` filter on purpose: 0 (= no limit) must
    # survive rendering, and an absent key falls back to the chart's
    # values.yaml default.
    supportBundle:
      {{- /* Not `| default 7`: Sprig's default treats 0 as empty, and 0 here is the documented
           keep-forever, so an explicit 0 was rendered as 7 and bundles were deleted after a week.
           Only an absent (or empty) key takes 7 — the service's own default — and the line stays
           unconditional so every install that does not set 0 renders the bytes it did before. */}}
      {{- $retentionDays := 7 }}
      {{- if and (hasKey $sb "retentionDays") (ne (toString $sb.retentionDays) "") }}
      {{- $retentionDays = $sb.retentionDays }}
      {{- end }}
      retentionDays: {{ $retentionDays }}
      {{- /* The rendered `#` comment above this block is part of the Secret's bytes (and so of the config checksum), so
           it stays as shipped. What actually happens to an absent key: under --reuse-values from
           a chart that predates it, values.yaml is not consulted, so the key is left out and the
           service applies its own default — 8, the same number values.yaml carries. hasKey rather
           than a truthiness test, so an explicit 0 still renders. */}}
      {{- if hasKey $sb "streamRateLimitMBps" }}
      streamRateLimitMBps: {{ $sb.streamRateLimitMBps }}
      {{- end }}
    # Query-history collection: off by default, matching the PhoenixAI Database-side
    # enable_collect_query_detail_info default. slowQueryMs renders only when
    # the key exists and without a `default` filter, on purpose: an explicit 0
    # (persist everything) must survive rendering, while an absent key falls
    # back to the backend's 5000 ms default.
    queryHistory:
      enabled: {{ include "anywhere.bool" $qh.enabled }}
      collectInterval: {{ $qh.collectInterval | default "10s" | quote }}
      retentionDays: {{ $qh.retentionDays | default 7 }}
      {{- if hasKey $qh "slowQueryMs" }}
      slowQueryMs: {{ $qh.slowQueryMs }}
      {{- end }}
      {{- /* profileBackfillLimit is not in values.yaml: an install that does not set it renders
             the config Secret it rendered before the key existed (no pod roll on upgrade), and
             the service applies its own default, 1000. hasKey, so an explicit value reaches the
             service, which refuses anything below 1 at startup. */}}
      {{- if hasKey $qh "profileBackfillLimit" }}
      profileBackfillLimit: {{ $qh.profileBackfillLimit }}
      {{- end }}
    # PhoenixAI Database license knobs: how far ahead of expiry warnings fire, and the
    # in-memory TTL for a cluster's registered-license list (absorbs License
    # page and cluster-list polling). cacheTTL has no `default` filter on
    # purpose: an explicit "0s" (no caching) must survive rendering, and an
    # absent key falls back to the chart's values.yaml default.
    license:
      expiryWarnWindow: {{ $lic.expiryWarnWindow | default "720h" | quote }}
      {{- if hasKey $lic "cacheTTL" }}
      cacheTTL: {{ $lic.cacheTTL | quote }}
      {{- end }}
