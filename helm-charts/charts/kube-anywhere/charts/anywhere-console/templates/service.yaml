{{- /* The published Service. Every service.* key is read nil-safe: `helm upgrade --reuse-values`
     from a chart that predates the block hands the templates no `service` at all, which must
     render the ClusterIP Service it always did. A key that does not apply to the chosen type is
     refused rather than dropped: a source-range list that silently restricted nothing would read
     as a restriction that is in force. */}}
{{- $svc := .Values.service | default dict }}
{{- $type := $svc.type | default "ClusterIP" }}
{{- if not (has $type (list "ClusterIP" "NodePort" "LoadBalancer")) }}
{{- fail (printf "service.type must be ClusterIP, NodePort or LoadBalancer, got %q" (toString $type)) }}
{{- end }}
{{- $external := ne $type "ClusterIP" }}
{{- if and $svc.nodePort (not $external) }}
{{- fail "service.nodePort needs service.type NodePort or LoadBalancer; clear it, or change service.type" }}
{{- end }}
{{- if and $svc.nodePort (not (regexMatch "^[0-9]+$" (toString $svc.nodePort))) }}
{{- fail (printf "service.nodePort must be a port number, got %q" (toString $svc.nodePort)) }}
{{- end }}
{{- if and $svc.loadBalancerSourceRanges (ne $type "LoadBalancer") }}
{{- fail "service.loadBalancerSourceRanges needs service.type LoadBalancer; clear it, or change service.type" }}
{{- end }}
{{- if $svc.externalTrafficPolicy }}
{{- if not $external }}
{{- fail "service.externalTrafficPolicy needs service.type NodePort or LoadBalancer; clear it, or change service.type" }}
{{- end }}
{{- if not (has $svc.externalTrafficPolicy (list "Cluster" "Local")) }}
{{- fail (printf "service.externalTrafficPolicy must be Cluster or Local, got %q" (toString $svc.externalTrafficPolicy)) }}
{{- end }}
{{- end }}
{{- if hasKey ($svc.labels | default dict) "app" }}
{{- fail "service.labels.app is the chart's own Service label and cannot be overridden; remove it from service.labels" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "anywhere.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
    {{- with $svc.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP by default; how to expose the UI (port-forward / Ingress / LoadBalancer)
  # is the user's choice.
  type: {{ $type }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    app: {{ template "anywhere.name" . }}
  ports:
  - port: {{ include "anywhere.servicePort" . }}
    targetPort: http
    {{- with $svc.nodePort }}
    nodePort: {{ . }}
    {{- end }}
    protocol: TCP
    name: http
---
# Headless governing Service required by the StatefulSet (stable pod
# identity); UI traffic keeps using the ClusterIP Service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ template "anywhere.name" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
spec:
  clusterIP: None
  selector:
    app: {{ template "anywhere.name" . }}
  ports:
  - port: {{ .Values.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
