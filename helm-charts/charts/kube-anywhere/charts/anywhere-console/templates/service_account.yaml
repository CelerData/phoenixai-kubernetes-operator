{{- /*
Always rendered: anywhere cannot resolve cluster credentials or exec into pods without its
own identity and grants, so there is no create-toggle — a chart install without RBAC would
only produce a broken install.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "anywhere.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ template "anywhere.name" . }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
