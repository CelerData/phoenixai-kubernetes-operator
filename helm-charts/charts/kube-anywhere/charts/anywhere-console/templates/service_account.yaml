{{- /*
Rendered unless serviceAccount.create is false: some platforms install charts under an identity
that may not create ServiceAccounts or RBAC, and hand the release a ready-made account instead.
The pod then runs as serviceAccount.name (required in that case — anywhere.serviceAccountName
refuses an empty one), and that account must hold the grants role.yaml / clusterrole.yaml list.
*/}}
{{- if eq (include "anywhere.serviceAccountCreate" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "anywhere.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ template "anywhere.name" . }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
