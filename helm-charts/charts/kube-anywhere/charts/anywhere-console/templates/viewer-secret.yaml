{{- /*
Viewer-role accounts: a second Secret in the same shape as the admin one (key = username,
value = password), mounted as its own directory and read by the backend on every login. A
viewer reads everything, builds and deletes support bundles, and runs the commands and exec
presets an admin has defined; it cannot change a cluster or the console's configuration, run
an arbitrary command, or download/export a support bundle. Rendered only from viewer.users;
with viewer.existingSecret the user manages the Secret, and with neither there are no viewer
accounts and nothing here renders. A username in both Secrets holds both roles, each opened
by its own Secret's password.
*/}}
{{- $viewer := .Values.viewer | default dict }}
{{- if and $viewer.users (not $viewer.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "anywhere.viewerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
type: Opaque
stringData:
  {{- range $user, $password := $viewer.users }}
  {{ $user }}: {{ $password | quote }}
  {{- end }}
{{- end }}
