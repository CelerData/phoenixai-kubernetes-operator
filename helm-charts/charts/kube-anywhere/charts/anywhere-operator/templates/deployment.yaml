{{- if .Values.phoenixAIOperator.enabled }}
{{- $operatorLabels := .Values.phoenixAIOperator.labels | default dict }}
{{- if not (kindIs "map" $operatorLabels) }}
{{- fail "phoenixAIOperator.labels must be a map" }}
{{- end }}
{{- range $reservedLabel := list "app" "version" "app.kubernetes.io/managed-by" }}
{{- if hasKey $operatorLabels $reservedLabel }}
{{- fail (printf "phoenixAIOperator.labels cannot override reserved label %q" $reservedLabel) }}
{{- end }}
{{- end }}
{{- range $key, $value := $operatorLabels }}
{{- if or (kindIs "map" $value) (kindIs "slice" $value) (kindIs "invalid" $value) }}
{{- fail (printf "phoenixAIOperator.labels value for %q must be a string, number, or boolean" $key) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "operator.name" . }}-operator
  namespace: {{ template "operator.namespace" . }}
  labels:
    app: {{ template "operator.name" . }}-operator
    {{- range $key, $value := $operatorLabels }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
  {{- if .Values.phoenixAIOperator.annotations }}
  annotations:
    {{- toYaml .Values.phoenixAIOperator.annotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ template "operator.name" . }}-operator
  replicas: {{ .Values.phoenixAIOperator.replicaCount }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      {{- if .Values.phoenixAIOperator.annotations }}
        {{- toYaml .Values.phoenixAIOperator.annotations | nindent 8 }}
      {{- end }}
      labels:
        app: {{ template "operator.name" . }}-operator
        version: {{ $.Chart.Version }}
        {{- range $key, $value := $operatorLabels }}
        {{ $key | quote }}: {{ $value | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: true
      {{- if .Values.phoenixAIOperator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.phoenixAIOperator.imagePullSecrets | nindent 6 }}
      {{- end }}
      containers:
      - command:
        - /phoenixai-operator
        args:
        - --leader-elect
        {{- with .Values.phoenixAIOperator.log }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.phoenixAIOperator.watchNamespace }}
        - --namespace={{ .Values.phoenixAIOperator.watchNamespace }}
        {{- end }}
        {{- if .Values.phoenixAIOperator.dnsDomainSuffix }}
        - --dns-domain-suffix={{ .Values.phoenixAIOperator.dnsDomainSuffix }}
        {{- end }}
        - --volume-name-with-hash={{ .Values.phoenixAIOperator.volumeNameWithHash }}
        {{- if .Values.phoenixAIOperator.denyList }}
        - --deny-list={{ .Values.phoenixAIOperator.denyList }}
        {{- end }}
        {{- if .Values.phoenixAIOperator.enablePVCExpansion }}
        - --enable-pvc-expansion
        {{- end }}
        {{- if .Values.phoenixAIOperator.enablePodDisruptionBudget }}
        - --enable-pod-disruption-budget
        {{- end }}
        {{- if .Values.phoenixAIOperator.enableApiServer }}
        - --enable-api-server
        - --api-server-bind-address=:{{ .Values.phoenixAIOperator.apiServerPort }}
        {{- end }}
        {{- if .Values.phoenixAIOperator.feSslMode }}
        - --fe-ssl-mode={{ .Values.phoenixAIOperator.feSslMode }}
        {{- end }}
        env:
        - name: TZ
          value: {{ .Values.timeZone }}
        {{- if .Values.phoenixAIOperator.env }}
        {{- toYaml .Values.phoenixAIOperator.env | nindent 8 }}
        {{- end }}
        image: "{{ .Values.phoenixAIOperator.image.repository }}:{{ .Values.phoenixAIOperator.image.tag }}"
        imagePullPolicy: {{ .Values.phoenixAIOperator.imagePullPolicy }}
        name: manager
        {{- if .Values.phoenixAIOperator.enableApiServer }}
        ports:
        - containerPort: {{ .Values.phoenixAIOperator.apiServerPort }}
          name: grpc-api
          protocol: TCP
        {{- end }}
        {{- if .Values.phoenixAIOperator.securityContext }}
        securityContext:
          {{- toYaml .Values.phoenixAIOperator.securityContext | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          {{- toYaml .Values.phoenixAIOperator.resources | nindent 10 }}
      serviceAccountName: {{ template "operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- if .Values.phoenixAIOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.phoenixAIOperator.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.phoenixAIOperator.affinity }}
      affinity:
        {{- toYaml .Values.phoenixAIOperator.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.phoenixAIOperator.tolerations }}
      tolerations:
        {{- toYaml .Values.phoenixAIOperator.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
