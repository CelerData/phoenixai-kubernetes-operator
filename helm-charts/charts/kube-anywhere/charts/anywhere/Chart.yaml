apiVersion: v2
name: anywhere
description: A Helm chart for PhoenixAI Anywhere — a read-only operations & usage console for PhoenixAI deployments on Kubernetes
type: application

maintainers:
  - name: Ray Yan
    email: ray.yan@phoenixdata.ai

# Chart version — shared with the operator repo's charts (kube-anywhere,
# operator, phoenixai, warehouse), which all carry the same number. It moves once
# per release, when every chart is bumped together, so it is NOT bumped per
# chart or template change.
version: 2.0.0

# Version of the deployed application — rendered verbatim as the image tag when
# image.tag is empty, so it is spelled like the git tag that produced that image
# (v-prefixed), not like `version:` above. Unlike `version:`, this field is a
# free-form string, not SemVer (the sibling phoenixai subchart carries a data-plane
# image tag, "4.1.5-ee").
appVersion: "v2.0.0"

kubeVersion: ">=1.23.0-0"

keywords:
  - anywhere
  - console
  - phoenixai
  - database
  - olap

sources:
  - https://github.com/CelerData/phoenixai-kubernetes-operator

home: https://github.com/CelerData/phoenixai-kubernetes-operator
