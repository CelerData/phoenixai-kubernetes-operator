{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "phoenixaicluster.fe.name" . }}
  namespace: {{ template "phoenixaicluster.namespace" . }}
  labels:
    cluster: {{ template "phoenixaicluster.name" . }}
    {{- if .Values.metrics.serviceMonitor.labels }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: http
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      path: /metrics
      {{- if .Values.metrics.serviceMonitor.basicAuth.enabled }}
      basicAuth:
        username:
          name: {{ .Values.metrics.serviceMonitor.basicAuth.usernameSecretName }}
          key: {{ .Values.metrics.serviceMonitor.basicAuth.usernameSecretKey }}
        password:
          name: {{ .Values.metrics.serviceMonitor.basicAuth.passwordSecretName }}
          key: {{ .Values.metrics.serviceMonitor.basicAuth.passwordSecretKey }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.endpointParam.enabled }}
      params:
        {{- toYaml .Values.metrics.serviceMonitor.endpointParam.params | nindent 8 }}
      {{- end }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoints_label_app_phoenixai_ownerreference_name]
          targetLabel: app_phoenixai_ownerreference_name
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: app_kubernetes_io_component
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: group
        - action: replace
          replacement: {{ template "phoenixaicluster.name" . }}
          targetLabel: cluster
  namespaceSelector:
    matchNames:
      - {{ template "phoenixaicluster.namespace" . }}
  selector:
    matchLabels:
      app.phoenixai.ownerreference/name: {{ template "phoenixaicluster.name" . }}
      app.kubernetes.io/component: fe

---

{{- if .Values.phoenixAICluster.enabledCn }}

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "phoenixaicluster.cn.name" . }}
  namespace: {{ template "phoenixaicluster.namespace" . }}
  labels:
    cluster: {{ template "phoenixaicluster.name" . }}
    {{- if .Values.metrics.serviceMonitor.labels }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: webserver
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoints_label_app_phoenixai_ownerreference_name]
          targetLabel: app_phoenixai_ownerreference_name
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: app_kubernetes_io_component
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: group
        - action: replace
          replacement: {{ template "phoenixaicluster.name" . }}
          targetLabel: cluster
  namespaceSelector:
    matchNames:
      - {{ template "phoenixaicluster.namespace" . }}
  selector:
    matchLabels:
      app.phoenixai.ownerreference/name: {{ template "phoenixaicluster.name" . }}
      app.kubernetes.io/component: cn

{{- end }}

{{- $root := . }}
{{- range $entry := .Values.phoenixAICnGroups }}
{{- $crName := include "phoenixaicluster.cngroup.name" (dict "root" $root "entry" $entry) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-cngroup-cn" $crName }}
  namespace: {{ template "phoenixaicluster.namespace" $root }}
  labels:
    cluster: {{ template "phoenixaicluster.name" $root }}
    cngroup: {{ $entry.name }}
    {{- if $root.Values.metrics.serviceMonitor.labels }}
    {{- toYaml $root.Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: webserver
      {{- with $root.Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoints_label_app_phoenixai_ownerreference_name]
          targetLabel: app_phoenixai_ownerreference_name
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: app_kubernetes_io_component
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: group
        - action: replace
          replacement: {{ template "phoenixaicluster.name" $root }}
          targetLabel: cluster
        # The CN group name as the FE spells it, so a series can be traced back to one group.
        - action: replace
          replacement: {{ $crName | replace "-" "_" }}
          targetLabel: cngroup
  namespaceSelector:
    matchNames:
      - {{ template "phoenixaicluster.namespace" $root }}
  selector:
    matchLabels:
      # A CN group's sub-resources carry its own prefix, so the cluster's selector above cannot
      # match them - see GetPrefixNameForCnGroup in pkg/k8sutils/templates/object/meta.go.
      app.phoenixai.ownerreference/name: {{ printf "%s-cngroup" $crName }}
      app.kubernetes.io/component: cn
{{- end }}
{{- end }}
