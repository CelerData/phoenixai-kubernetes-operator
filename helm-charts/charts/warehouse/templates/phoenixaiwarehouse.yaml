apiVersion: phoenixdata.ai/v1
kind: PhoenixAIWarehouse
metadata:
  name: {{ template "phoenixaiwarehouse.name" . }}
  namespace: {{ template "phoenixaiwarehouse.namespace" . }}
  labels:
    warehouse: {{ template "phoenixaiwarehouse.name" . }}
    {{- include "phoenixaiwarehouse.labels" . | nindent 4 }}
spec:
  phoenixAICluster: {{ .Values.spec.phoenixAIClusterName }}
  template:
{{- include "phoenixaiwarehouse.cnspec" (dict "Values" .Values "cnspec" (dict "configMapName" (include "phoenixaiwarehouse.configmap.name" .) "configHash" (include "phoenixaiwarehouse.config.hash" .))) }}
