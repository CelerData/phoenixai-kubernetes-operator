{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "phoenixaiwarehouse.cn.name" . }}
  namespace: {{ template "phoenixaiwarehouse.namespace" . }}
  labels:
    cluster: {{ .Values.spec.phoenixAIClusterName }}
    warehouse: {{ template "phoenixaiwarehouse.name" . }}
    {{- if .Values.metrics.serviceMonitor.labels }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: webserver
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoints_label_app_phoenixai_ownerreference_name]
          targetLabel: app_phoenixai_ownerreference_name
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: app_kubernetes_io_component
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: group
        # A warehouse is compute attached to a PhoenixAICluster, so its CN series carry the same
        # `cluster` label as the cluster's own components: consumers that query one cluster then see
        # every compute node it has, warehouses included. `warehouse` tells the groups apart.
        - action: replace
          replacement: {{ .Values.spec.phoenixAIClusterName }}
          targetLabel: cluster
        - action: replace
          replacement: {{ template "phoenixaiwarehouse.name" . }}
          targetLabel: warehouse
  namespaceSelector:
    matchNames:
      - {{ template "phoenixaiwarehouse.namespace" . }}
  selector:
    matchLabels:
      # The operator labels a warehouse's sub-resources with the warehouse prefix, not the cluster
      # name — see GetPrefixNameForWarehouse in pkg/k8sutils/templates/object/meta.go.
      app.phoenixai.ownerreference/name: {{ template "phoenixaiwarehouse.prefix" . }}
      app.kubernetes.io/component: cn

{{- $root := . }}
{{- range $entry := .Values.cnGroups }}
{{- $crName := include "phoenixaiwarehouse.cngroup.name" (dict "root" $root "entry" $entry) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-cngroup-cn" $crName }}
  namespace: {{ template "phoenixaiwarehouse.namespace" $root }}
  labels:
    cluster: {{ $root.Values.spec.phoenixAIClusterName }}
    warehouse: {{ template "phoenixaiwarehouse.name" $root }}
    cngroup: {{ $entry.name }}
    {{- if $root.Values.metrics.serviceMonitor.labels }}
    {{- toYaml $root.Values.metrics.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: webserver
      {{- with $root.Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoints_label_app_phoenixai_ownerreference_name]
          targetLabel: app_phoenixai_ownerreference_name
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: app_kubernetes_io_component
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: group
        - action: replace
          replacement: {{ $root.Values.spec.phoenixAIClusterName }}
          targetLabel: cluster
        - action: replace
          replacement: {{ template "phoenixaiwarehouse.name" $root }}
          targetLabel: warehouse
        # The CN group name as the FE spells it, so a series can be traced back to one group.
        - action: replace
          replacement: {{ $crName | replace "-" "_" }}
          targetLabel: cngroup
  namespaceSelector:
    matchNames:
      - {{ template "phoenixaiwarehouse.namespace" $root }}
  selector:
    matchLabels:
      # A CN group's sub-resources carry its own prefix, so the warehouse's selector above cannot
      # match them — see GetPrefixNameForCnGroup in pkg/k8sutils/templates/object/meta.go.
      app.phoenixai.ownerreference/name: {{ printf "%s-cngroup" $crName }}
      app.kubernetes.io/component: cn
{{- end }}
{{- end }}
